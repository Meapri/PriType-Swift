# SwiftLint Configuration for PriType-Swift
# https://github.com/realm/SwiftLint

# Only enable essential rules for maintainability
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - unneeded_break_in_switch
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace  # Too noisy
  - line_length  # Custom limit below
  - identifier_name  # Allow short names like 'id', 'x', etc.
  - type_body_length  # HangulComposer is complex by nature
  - function_body_length  # handle() is complex by nature
  - file_length  # Some files are large
  - cyclomatic_complexity  # Hangul composition is complex
  - multiple_closures_with_trailing_closure  # SwiftUI builder style
  - type_name  # L10n namespaces intentionally use lowerCamelCase
  - trailing_comma  # Accepted by SwiftFormat/SPM style in this repo
  - force_cast  # CoreFoundation AX APIs require validated casts
  - force_unwrapping  # NSEvent test/benchmark helpers use deliberate force unwraps
  - implicitly_unwrapped_optional  # IMK override signatures require IUOs
  - large_tuple  # Benchmark table rows are intentionally compact
  - redundant_discardable_let
  - redundant_string_enum_value
  - unused_closure_parameter
  - for_where
  - is_disjoint

# Path exclusions
excluded:
  - .build
  - Tests
  - Sources/PriTypeVerify
  - scratch_*.swift
  - test*.swift
  - sim*.swift

# Custom rule configurations
nesting:
  type_level: 3
  function_level: 3

reporter: "xcode"
