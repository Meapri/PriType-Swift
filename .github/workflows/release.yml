name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: self-hosted
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Validate tag matches Info.plist channel
      run: |
        TAG_VERSION="${{ steps.version.outputs.VERSION }}"
        EXPECTED_CHANNEL="stable"
        EXPECTED_INFO_VERSION="$TAG_VERSION"
        if [[ "$TAG_VERSION" == *-* ]]; then
          EXPECTED_CHANNEL="beta"
          EXPECTED_INFO_VERSION="${TAG_VERSION%%-*}"
        fi

        INFO_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
        INFO_CHANNEL=$(/usr/libexec/PlistBuddy -c "Print :PriTypeReleaseChannel" Info.plist)

        if [ "$INFO_VERSION" != "$EXPECTED_INFO_VERSION" ]; then
          echo "Tag version $TAG_VERSION expects Info.plist version $EXPECTED_INFO_VERSION, found $INFO_VERSION" >&2
          exit 1
        fi

        if [ "$INFO_CHANNEL" != "$EXPECTED_CHANNEL" ]; then
          echo "Tag version $TAG_VERSION expects channel $EXPECTED_CHANNEL, found $INFO_CHANNEL" >&2
          exit 1
        fi
    
    - name: Import Certificates
      env:
        DEV_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
        DEV_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: |
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
        
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        
        # Import Developer ID Application certificate
        echo "$DEV_ID_APP_P12" | base64 --decode > $RUNNER_TEMP/dev_app.p12
        security import $RUNNER_TEMP/dev_app.p12 -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        
        # Import Developer ID Installer certificate
        echo "$DEV_ID_INSTALLER_P12" | base64 --decode > $RUNNER_TEMP/dev_installer.p12
        security import $RUNNER_TEMP/dev_installer.p12 -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        
        # Allow codesign to access the keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
    
    - name: Store Notary Credentials
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: |
        xcrun notarytool store-credentials "CI_NOTARY" \
          --apple-id "$APPLE_ID" \
          --team-id "$APPLE_TEAM_ID" \
          --password "$APPLE_APP_PASSWORD"

    - name: Build, Sign, Notarize and Validate
      run: KEYCHAIN_PROFILE=CI_NOTARY ./build_release.sh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "PriType ${{ steps.version.outputs.VERSION }}"
        generate_release_notes: true
        files: PriTypeV2_Release.pkg
    
    - name: Cleanup
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
        rm -f $RUNNER_TEMP/dev_app.p12 $RUNNER_TEMP/dev_installer.p12
