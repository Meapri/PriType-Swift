name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: self-hosted
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Build
      run: swift build -v
    
    - name: Run Unit Tests
      run: swift test -v

    - name: Run Verification Tests
      run: swift run PriTypeVerify
    
  lint:
    name: SwiftLint
    runs-on: self-hosted
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging --strict
